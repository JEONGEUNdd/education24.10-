<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>작업 모니터링 (WebSocket)</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>
    <h1>작업 메시지 모니터링 (WebSocket)</h1>
    <p>
        정상 메시지 수: <span id="normal-count">0</span>
    </p>
    <p>
        비정상 메시지 수: <span id="abnormal-count">0</span>
    </p>

    <div id="message-box" style="margin-top:20px; max-height:300px; overflow:auto; border:1px solid #ccc; padding:10px;">
        <h3>최근 메시지</h3>
        <ul id="message-list"></ul>
    </div>

    <script>
        const socket = io();
        socket.on('connect', function() {
            console.log('웹소켓 연결됨');
        });
        socket.on('message_update', function(res) {
            $('#normal-count').text(res.normal_count);
            $('#abnormal-count').text(res.abnormal_count);

            const msg = JSON.stringify(res.new_message);

            const color = res.new_message.status === 1 ? 'red' : 'black';    // pred가 1이면 비정상
            //const color = res.new_message["작업갯수"] > 10 ? 'red' : 'black';
            $('#message-list').prepend(`<li style="color:${color};">${msg}</li>`);

            // 보여줄 메시지 최대 50개
            if ($('#message-list li').length > 50) {
                $('#message-list li:last').remove();
            }
        });
    </script>
</body>
</html>
